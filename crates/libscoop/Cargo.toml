[package]
name = "libscoop"
description = "Rust library implementation of Scoop"
repository = "https://github.com/chawyehsu/hok"
documentation = "https://docs.rs/libscoop"
version = "0.1.0-beta.7"
authors = ["Chawye Hsu <su+cratesio@chawyehsu.com>"]
categories = ["command-line-utilities"]
keywords = ["package-manager", "windows", "scoop"]
license = "MIT OR Apache-2.0"
edition = "2021"
readme = "README.md"

[dependencies]
chrono = "0.4"
curl = { version = "0.4", features = ["static-curl"] }
dirs = "5.0.1"
flume = "0.10"
futures = { version = "0.3", features = ["thread-pool"] }
git2 = "0.19.0"
once_cell = "1.18.0"
rayon = "1.7.0"
regex = "1.5.3"
remove_dir_all = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.29"
thiserror = "1.0"
tracing = "0.1.41"

# Archive
lzma-rust2 = "0.21.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["util"] }
tar = "0.4.44"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dependencies.scoop-hash]
version = "0.1.0-beta.7"
path = "../scoop_hash"

[target.'cfg(windows)'.dependencies]
junction = "1.2.0"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[features]
default = []
rustcrypto-hash = ["scoop-hash/rustcrypto"]
